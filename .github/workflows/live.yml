name: love-song-live
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install FFmpeg and Python Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install moviepy==1.0.3 pillow

    - name: Start Python Live Stream Loop
      env:
        YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
      run: python stream.py
